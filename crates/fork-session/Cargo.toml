[package]
name = "fork-session"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Local in-process session over the vendored Percolator v16 risk engine."

[dependencies]
percolator = { path = "../../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "fork-engine"
path = "src/bin/fork-engine.rs"
